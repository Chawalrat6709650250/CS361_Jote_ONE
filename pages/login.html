<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="เข้าสู่ระบบเว็บไซต์ Computer Science TU"
    />
    <title>เข้าสู่ระบบ | Computer Science TU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/css/login.css" />
  </head>
  <body>
    <main class="login-page">
      <a class="login-brand" href="../index.html" aria-label="กลับสู่หน้าหลัก">
        <span class="login-brand__title"
          >COMPUTER <strong>SCIENCE</strong></span
        >
        <span class="login-brand__university">THAMMASAT UNIVERSITY</span>
      </a>

      <section class="login-card" aria-labelledby="login-title">
        <img
          class="login-card__seal"
          src="../src/assets/images/tu-emblem.webp"
          alt=""
        />
        <h1 id="login-title">เข้าสู่ระบบ</h1>
        <p class="login-card__subtitle">
          เข้าสู่ระบบด้วยบัญชีมหาวิทยาลัยธรรมศาสตร์
        </p>

        <form id="login-form" class="login-form" novalidate>
          <div class="login-form__group">
            <label for="username">ชื่อผู้ใช้</label>
            <div class="login-form__input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="3.25" />
                <path d="M5.5 20c.65-3.15 3.15-5.1 6.5-5.1s5.85 1.95 6.5 5.1" />
              </svg>
              <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                placeholder="ชื่อผู้ใช้ / รหัสประจำตัวนักศึกษา"
              />
            </div>
            <p
              id="username-error"
              class="login-form__error"
              aria-live="polite"
            ></p>
          </div>

          <div class="login-form__group">
            <label for="password">รหัสผ่าน</label>
            <div class="login-form__input-wrap">
              <svg aria-hidden="true" viewBox="0 0 24 24">
                <rect x="5" y="10" width="14" height="10" rx="2" />
                <path d="M8.5 10V7.5a3.5 3.5 0 0 1 7 0V10" />
              </svg>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="รหัสผ่าน"
              />
              <button
                id="password-toggle"
                class="login-form__password-toggle"
                type="button"
                aria-label="แสดงรหัสผ่าน"
              >
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path
                    d="M2.5 12s3.2-5.5 9.5-5.5S21.5 12 21.5 12s-3.2 5.5-9.5 5.5S2.5 12 2.5 12Z"
                  />
                  <circle cx="12" cy="12" r="2.75" />
                </svg>
              </button>
            </div>
            <p
              id="password-error"
              class="login-form__error"
              aria-live="polite"
            ></p>
          </div>

          <p
            id="login-status"
            class="login-form__status"
            role="status"
            aria-live="polite"
          ></p>
          <button id="login-submit" class="login-form__submit" type="submit">
            เข้าสู่ระบบ
          </button>
        </form>
      </section>
    </main>

    <script src="../src/js/config.js"></script>
    <script src="../src/js/auth.js"></script>
    <script src="../src/js/login.js?v=20261029-return-to-page"></script>
  </body>
</html>
